; Supervisor controls the long-running processes inside the container:
;   - ollama  : local GPU model server (cloud agents ignore it)
;   - api     : FastAPI control plane that launches Claude Code / Codex jobs
;
; Agent runs themselves are NOT supervised here; they are short-lived
; subprocesses spawned per-request by the API and tracked as "jobs".

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:ollama]
command=/usr/local/bin/ollama serve
autostart=%(ENV_ENABLE_OLLAMA)s
autorestart=true
startretries=3
environment=OLLAMA_HOST="0.0.0.0:11434"
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama.err.log
priority=10

[program:api]
command=uvicorn server:app --host 0.0.0.0 --port 8080 --app-dir /opt/api
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err.log
priority=20
