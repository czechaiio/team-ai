<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sreality — CzechAI Dashboard</title>
<style>
:root {
  --red: #ce1126;
  --red-dark: #a80d1e;
  --red-light: #fef2f2;
  --red-bg: #fff5f5;
  --bg: #f5f5f5;
  --white: #fff;
  --card: #fff;
  --border: #e5e5e5;
  --border2: #ddd;
  --text: #1a1a1a;
  --text2: #333;
  --text-dim: #555;
  --text-muted: #888;
  --text-light: #aaa;
  --green: #16a34a;
  --blue: #2563eb;
  --orange: #ea580c;
  --purple: #7c3aed;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SF Mono', Monaco, 'Courier New', monospace;
  --radius: 10px;
  --sidebar-w: 270px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.4; overflow: hidden; height: 100vh; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #f0f0f0; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #aaa; }

.app { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--white); border-right: 1px solid var(--border);
  overflow-y: auto; flex-shrink: 0;
  transition: transform 0.2s, width 0.2s, min-width 0.2s;
}
.sidebar.collapsed { transform: translateX(-100%); min-width: 0; width: 0; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; height: 52px; background: var(--red); color: #fff; flex-shrink: 0;
}
.toggle-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; cursor: pointer; padding: 6px 9px; border-radius: 4px; font-size: 16px; }
.toggle-btn:hover { background: rgba(255,255,255,0.25); }
.header-logo { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.header-logo small { font-weight: 400; font-size: 12px; opacity: 0.7; margin-left: 6px; }
.hstats { display: flex; gap: 20px; margin-left: auto; font-size: 11px; opacity: 0.9; }
.hstats div { text-align: center; }
.hstats .hval { font-size: 15px; font-weight: 700; display: block; }

.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; background: var(--white);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.search-wrap { flex: 1; min-width: 180px; position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: #999; fill: none; stroke-width: 2; }
.search-box {
  width: 100%; padding: 8px 12px 8px 34px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  font-size: 13px; font-family: var(--font); color: var(--text);
  outline: none; background: var(--bg);
}
.search-box:focus { border-color: var(--red); box-shadow: 0 0 0 2px rgba(206,17,38,0.1); }
.search-box::placeholder { color: #bbb; }
.sort-sel { padding: 8px 10px; border: 1px solid var(--border2); border-radius: var(--radius); font-size: 12px; font-family: var(--font); color: var(--text2); background: var(--white); cursor: pointer; }
.sort-sel:focus { border-color: var(--red); }
.view-btns { display: flex; gap: 1px; }
.vbtn { padding: 7px 11px; border: 1px solid var(--border2); background: var(--white); color: var(--text-muted); cursor: pointer; font-size: 14px; transition: all 0.1s; }
.vbtn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.vbtn:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.vbtn.active { background: var(--red); color: #fff; border-color: var(--red); }
.vbtn:hover:not(.active) { background: var(--red-light); color: var(--red); }

.af-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 16px; background: var(--red-bg); border-bottom: 1px solid #fecaca; flex-shrink: 0; }
.af-bar.empty { display: none; }
.af-lab { font-size: 10px; color: var(--red-dark); font-weight: 600; text-transform: uppercase; }
.af-chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; border: 1px solid #fca5a5; border-radius: 4px; padding: 2px 8px; font-size: 10px; color: var(--red-dark); }
.af-clear { background: none; border: none; color: var(--red); font-size: 10px; cursor: pointer; font-weight: 600; margin-left: 4px; }
.af-clear:hover { text-decoration: underline; }

/* SIDEBAR */
.sb-top { padding: 14px; border-bottom: 1px solid var(--border); background: var(--red-light); }
.sb-top-title { font-size: 13px; font-weight: 700; color: var(--red); }
.sb-top-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.reset-btn { margin-top: 8px; width: 100%; padding: 6px; background: var(--white); border: 1px solid var(--red); border-radius: var(--radius); color: var(--red); font-size: 11px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.reset-btn:hover { background: var(--red); color: #fff; }
.sb-sec { border-bottom: 1px solid var(--border); }
.sb-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-dim); }
.sb-h:hover { color: var(--red); background: var(--red-light); }
.sb-h .arr { font-size: 9px; transition: transform 0.15s; color: var(--text-light); }
.sb-h .arr.open { transform: rotate(90deg); }
.sb-b { padding: 4px 14px 10px; }
.sb-b.hidden { display: none; }
.fcheck { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; font-size: 12px; color: var(--text2); }
.fcheck:hover { color: var(--red); }
.fcheck input[type="checkbox"] { accent-color: var(--red); width: 14px; height: 14px; cursor: pointer; }
.fcheck .cnt { margin-left: auto; font-size: 10px; color: var(--text-light); font-family: var(--mono); }
.rng-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.rng-in { flex: 1; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 4px; font-size: 11px; font-family: var(--mono); color: var(--text); outline: none; background: var(--bg); width: 100%; }
.rng-in:focus { border-color: var(--red); }
.rng-in::placeholder { color: #ccc; }
.rng-lab { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
.qtags { display: flex; flex-wrap: wrap; gap: 4px; }
.qt { background: var(--white); border: 1px solid var(--border2); border-radius: 4px; color: var(--text-dim); font-size: 10px; padding: 3px 8px; cursor: pointer; font-family: var(--font); transition: all 0.1s; white-space: nowrap; }
.qt:hover { border-color: var(--red); color: var(--red); }
.qt.active { background: var(--red); color: #fff; border-color: var(--red); }

.content { flex: 1; overflow-y: auto; padding: 12px 16px; background: var(--bg); }

/* CARDS WITH IMAGES */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.cards.listv { grid-template-columns: 1fr; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  cursor: pointer; transition: all 0.15s;
}
.card:hover { border-color: var(--red); box-shadow: 0 4px 16px rgba(206,17,38,0.1); transform: translateY(-2px); }

.c-img {
  width: 100%; height: 120px; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.c-img svg { width: 60px; height: 60px; opacity: 0.5; }
.c-cat-badge {
  position: absolute; top: 8px; left: 8px;
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.4px; padding: 3px 8px; border-radius: 4px;
}
.c-portal-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 9px; color: #fff; background: rgba(0,0,0,0.5);
  padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
}
.c-body { padding: 10px 12px; }
.c-title { font-size: 12px; font-weight: 500; color: var(--text2); line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 31px; }
.c-mesto { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.c-mesto .c-gps { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 4px; vertical-align: middle; }
.c-price { font-size: 18px; font-weight: 800; color: var(--red); margin-bottom: 6px; }
.c-metrics { display: flex; gap: 14px; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.c-metrics b { color: var(--text2); font-weight: 600; }
.c-bot { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); }
.c-loc { font-size: 10px; color: var(--text-muted); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-gps { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 4px; vertical-align: middle; }
.c-link { font-size: 10px; color: var(--red); text-decoration: none; font-weight: 600; padding: 3px 10px; border: 1px solid var(--red); border-radius: 4px; transition: all 0.1s; }
.c-link:hover { background: var(--red); color: #fff; }

/* Category image backgrounds */
.cimg-BYTY { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); }
.cimg-DOMY { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); }
.cimg-POZEMKY { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); }
.cimg-CHATY { background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%); }
.cimg-KOMERCNI_PROSTORY,.cimg-KOMERCNI_OSTATNI { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); }
.cimg-KANCELARE { background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); }
.cimg-GARAZE { background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%); }
.cimg-SKLADY { background: linear-gradient(135deg, #eceff1 0%, #cfd8dc 100%); }
.cimg-DRAZBY { background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%); }
.cimg-NOVOSTAVBY { background: linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%); }
.cimg-PODILY { background: linear-gradient(135deg, #fff3e0 0%, #ffcc80 100%); }
.cimg-ZEMEDELSKE { background: linear-gradient(135deg, #f1f8e9 0%, #c5e1a5 100%); }
.cimg-OSTATNI { background: linear-gradient(135deg, #fafafa 0%, #eeeeee 100%); }

/* Category badge colors */
.cb-BYTY { background: #16a34a; color: #fff; }
.cb-DOMY { background: #2563eb; color: #fff; }
.cb-POZEMKY { background: #d97706; color: #fff; }
.cb-CHATY { background: #7c3aed; color: #fff; }
.cb-KOMERCNI_PROSTORY,.cb-KOMERCNI_OSTATNI { background: #db2777; color: #fff; }
.cb-KANCELARE { background: #0891b2; color: #fff; }
.cb-GARAZE { background: #57534e; color: #fff; }
.cb-SKLADY { background: #64748b; color: #fff; }
.cb-DRAZBY { background: #dc2626; color: #fff; }
.cb-NOVOSTAVBY { background: #059669; color: #fff; }
.cb-PODILY { background: #ea580c; color: #fff; }
.cb-ZEMEDELSKE { background: #65a30d; color: #fff; }
.cb-OSTATNI { background: #6b7280; color: #fff; }

/* LIST VIEW */
.listv .card { display: flex; flex-direction: row; }
.listv .c-img { width: 180px; min-width: 180px; height: 120px; }
.listv .c-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.listv .c-bot { margin-top: auto; }

/* PAGINATION */
.pag { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--white); flex-shrink: 0; }
.pbtn { padding: 5px 10px; border: 1px solid var(--border2); border-radius: 4px; background: var(--white); color: var(--text-dim); font-size: 12px; cursor: pointer; font-family: var(--font); min-width: 32px; text-align: center; transition: all 0.1s; }
.pbtn:hover:not(:disabled):not(.active) { border-color: var(--red); color: var(--red); }
.pbtn.active { background: var(--red); color: #fff; border-color: var(--red); }
.pbtn:disabled { opacity: 0.3; cursor: not-allowed; }
.pinfo { font-size: 11px; color: var(--text-muted); margin: 0 10px; }
.ppsel { padding: 5px 8px; border: 1px solid var(--border2); border-radius: 4px; font-size: 11px; color: var(--text2); background: var(--white); cursor: pointer; margin-left: 10px; }

.lov { position: absolute; inset: 0; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
.lov.hidden { display: none; }
.spin { width: 36px; height: 36px; border: 3px solid #eee; border-top-color: var(--red); border-radius: 50%; animation: sp 0.7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.empty-s { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-muted); }
.empty-s .ei { font-size: 48px; margin-bottom: 12px; }
.empty-s .et { font-size: 15px; font-weight: 600; color: var(--text-dim); }
.empty-s .es { font-size: 12px; color: var(--text-light); margin-top: 4px; }

@media (max-width: 768px) {
  .sidebar { position: fixed; z-index: 50; height: 100vh; }
  .cards { grid-template-columns: 1fr; }
  .hstats { display: none; }
  .c-img { height: 100px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-top-title">⚡ FILTRY</div>
      <div class="sb-top-sub" id="filterCount">0 aktivních</div>
      <button class="reset-btn" onclick="resetAll()">⟳ Resetovat vše</button>
    </div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">Hledání v názvu <span class="arr open">▶</span></div><div class="sb-b"><input type="text" class="rng-in" id="sideSearch" placeholder="3+1, balkon, cihlový..." oninput="deb()" style="width:100%"></div></div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">Kategorie <span class="arr open">▶</span></div><div class="sb-b" id="fCat"></div></div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">Typ <span class="arr open">▶</span></div><div class="sb-b" id="fTyp"></div></div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">Transakce <span class="arr open">▶</span></div><div class="sb-b" id="fTran"></div></div>
    <div class="sb-sec">
      <div class="sb-h" onclick="tog(this)">Cena (Kč) <span class="arr open">▶</span></div>
      <div class="sb-b">
        <div class="rng-row"><input type="number" class="rng-in" id="prMin" placeholder="od" oninput="deb()"><span style="color:#ccc">—</span><input type="number" class="rng-in" id="prMax" placeholder="do" oninput="deb()"></div>
        <div class="rng-lab">Rychlé</div>
        <div class="qtags">
          <button class="qt" data-a="0" data-b="1000000" onclick="setPr(this)">do 1M</button>
          <button class="qt" data-a="1000000" data-b="3000000" onclick="setPr(this)">1–3M</button>
          <button class="qt" data-a="3000000" data-b="5000000" onclick="setPr(this)">3–5M</button>
          <button class="qt" data-a="5000000" data-b="10000000" onclick="setPr(this)">5–10M</button>
          <button class="qt" data-a="10000000" data-b="999999999" onclick="setPr(this)">10M+</button>
        </div>
      </div>
    </div>
    <div class="sb-sec">
      <div class="sb-h" onclick="tog(this)">Plocha (m²) <span class="arr open">▶</span></div>
      <div class="sb-b">
        <div class="rng-row"><input type="number" class="rng-in" id="arMin" placeholder="od" oninput="deb()"><span style="color:#ccc">—</span><input type="number" class="rng-in" id="arMax" placeholder="do" oninput="deb()"></div>
        <div class="qtags">
          <button class="qt" data-a="0" data-b="30" onclick="setAr(this)">do 30</button>
          <button class="qt" data-a="30" data-b="60" onclick="setAr(this)">30–60</button>
          <button class="qt" data-a="60" data-b="100" onclick="setAr(this)">60–100</button>
          <button class="qt" data-a="100" data-b="200" onclick="setAr(this)">100–200</button>
          <button class="qt" data-a="200" data-b="999999" onclick="setAr(this)">200+</button>
        </div>
      </div>
    </div>
    <div class="sb-sec">
      <div class="sb-h" onclick="tog(this)">Kč/m² <span class="arr open">▶</span></div>
      <div class="sb-b">
        <div class="rng-row"><input type="number" class="rng-in" id="ppMin" placeholder="od" oninput="deb()"><span style="color:#ccc">—</span><input type="number" class="rng-in" id="ppMax" placeholder="do" oninput="deb()"></div>
        <div class="qtags">
          <button class="qt" data-a="0" data-b="30000" onclick="setPP(this)">do 30k</button>
          <button class="qt" data-a="30000" data-b="60000" onclick="setPP(this)">30–60k</button>
          <button class="qt" data-a="60000" data-b="100000" onclick="setPP(this)">60–100k</button>
          <button class="qt" data-a="100000" data-b="200000" onclick="setPP(this)">100–200k</button>
          <button class="qt" data-a="200000" data-b="999999" onclick="setPP(this)">200k+</button>
        </div>
      </div>
    </div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">GPS <span class="arr open">▶</span></div><div class="sb-b"><label class="fcheck"><input type="radio" name="gps" value="all" checked onchange="apply()"> Vše</label><label class="fcheck"><input type="radio" name="gps" value="yes" onchange="apply()"> S GPS</label><label class="fcheck"><input type="radio" name="gps" value="no" onchange="apply()"> Bez GPS</label></div></div>
    <div class="sb-sec"><div class="sb-h" onclick="tog(this)">Portál <span class="arr">▶</span></div><div class="sb-b hidden" id="fPort"></div></div>
    <div class="sb-sec">
      <div class="sb-h" onclick="tog(this)">Lokalita <span class="arr open">▶</span></div>
      <div class="sb-b">
        <input type="text" class="rng-in" id="locSearch" placeholder="Praha, Brno..." oninput="deb()" style="width:100%">
        <div class="qtags" style="margin-top:6px">
          <button class="qt" onclick="setLoc(this,'Praha')">Praha</button>
          <button class="qt" onclick="setLoc(this,'Brno')">Brno</button>
          <button class="qt" onclick="setLoc(this,'Ostrava')">Ostrava</button>
          <button class="qt" onclick="setLoc(this,'Plzeň')">Plzeň</button>
          <button class="qt" onclick="setLoc(this,'Olomouc')">Olomouc</button>
          <button class="qt" onclick="setLoc(this,'Liberec')">Liberec</button>
          <button class="qt" onclick="setLoc(this,'Pardubice')">Pardubice</button>
          <button class="qt" onclick="setLoc(this,'Karlovy')">K.Vary</button>
          <button class="qt" onclick="setLoc(this,'České Budějovice')">Č.Budějovice</button>
          <button class="qt" onclick="setLoc(this,'Hradec')">H.Králové</button>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="header">
      <button class="toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">☰</button>
      <div class="header-logo">SREALITY<small>dashboard</small></div>
      <div class="hstats">
        <div><span class="hval" id="sT">—</span>celkem</div>
        <div><span class="hval" id="sF">—</span>filtrováno</div>
        <div><span class="hval" id="sB">—</span>byty</div>
        <div><span class="hval" id="sD">—</span>domy</div>
        <div><span class="hval" id="sP">—</span>pozemky</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-box" id="mainSearch" placeholder="Hledat v názvech..." oninput="deb()">
      </div>
      <select class="sort-sel" id="sortBy" onchange="apply()">
        <option value="pr_d">Cena ↓</option><option value="pr_a">Cena ↑</option>
        <option value="ar_d">Plocha ↓</option><option value="ar_a">Plocha ↑</option>
        <option value="pp_d">Kč/m² ↓</option><option value="pp_a">Kč/m² ↑</option>
        <option value="nm_a">Název A–Z</option>
      </select>
      <div class="view-btns">
        <button class="vbtn active" onclick="setView('grid',this)">▦</button>
        <button class="vbtn" onclick="setView('list',this)">☰</button>
      </div>
    </div>
    <div class="af-bar empty" id="afBar"><span class="af-lab">Filtry:</span><div id="afTags"></div><button class="af-clear" onclick="resetAll()">Zrušit vše</button></div>
    <div class="content" id="content" style="position:relative">
      <div class="lov" id="loading"><div class="spin"></div></div>
      <div class="cards" id="grid"></div>
      <div class="empty-s" id="emptyS" style="display:none"><div class="ei">🏠</div><div class="et">Žádné výsledky</div><div class="es">Zkuste změnit filtry</div></div>
    </div>
    <div class="pag" id="pag">
      <button class="pbtn" id="pPrev" onclick="chPg(-1)">‹</button>
      <div id="pBtns" style="display:inline-flex;gap:3px"></div>
      <button class="pbtn" id="pNext" onclick="chPg(1)">›</button>
      <span class="pinfo" id="pInfo"></span>
      <select class="ppsel" id="ppSel" onchange="chPP()"><option value="30">30</option><option value="60" selected>60</option><option value="120">120</option><option value="240">240</option></select>
    </div>
  </div>
</div>

<script>
// SVG icons per category
var ICONS = {
  BYTY: '<svg viewBox="0 0 64 64" fill="none" stroke="#16a34a" stroke-width="2"><rect x="12" y="20" width="40" height="30" rx="2"/><rect x="22" y="32" width="8" height="8" rx="1"/><rect x="34" y="32" width="8" height="8" rx="1"/><line x1="32" y1="20" x2="32" y2="50"/><path d="M8 22L32 8L56 22"/></svg>',
  DOMY: '<svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="2"><path d="M8 30L32 10L56 30"/><rect x="14" y="28" width="36" height="24" rx="1"/><rect x="26" y="38" width="12" height="14"/><rect x="18" y="32" width="8" height="6" rx="1"/><rect x="38" y="32" width="8" height="6" rx="1"/></svg>',
  POZEMKY: '<svg viewBox="0 0 64 64" fill="none" stroke="#d97706" stroke-width="2"><path d="M4 50 Q16 30 32 45 Q48 32 60 50Z"/><circle cx="48" cy="16" r="6"/><line x1="32" y1="20" x2="32" y2="38"/><path d="M26 20Q32 10 38 20"/></svg>',
  CHATY: '<svg viewBox="0 0 64 64" fill="none" stroke="#7c3aed" stroke-width="2"><path d="M10 34L32 14L54 34"/><rect x="16" y="32" width="32" height="20" rx="1"/><rect x="26" y="38" width="12" height="14"/><path d="M6 52Q18 42 32 50Q46 42 58 52"/></svg>',
  KOMERCNI_PROSTORY: '<svg viewBox="0 0 64 64" fill="none" stroke="#db2777" stroke-width="2"><rect x="10" y="14" width="44" height="38" rx="2"/><rect x="16" y="20" width="12" height="8" rx="1"/><rect x="36" y="20" width="12" height="8" rx="1"/><rect x="16" y="34" width="12" height="8" rx="1"/><rect x="36" y="34" width="12" height="8" rx="1"/><line x1="10" y1="14" x2="54" y2="14"/></svg>',
  KOMERCNI_OSTATNI: '<svg viewBox="0 0 64 64" fill="none" stroke="#db2777" stroke-width="2"><rect x="10" y="14" width="44" height="38" rx="2"/><rect x="16" y="20" width="12" height="8" rx="1"/><rect x="36" y="20" width="12" height="8" rx="1"/><rect x="16" y="34" width="12" height="8" rx="1"/><rect x="36" y="34" width="12" height="8" rx="1"/></svg>',
  KANCELARE: '<svg viewBox="0 0 64 64" fill="none" stroke="#0891b2" stroke-width="2"><rect x="14" y="10" width="36" height="42" rx="2"/><rect x="20" y="16" width="8" height="6" rx="1"/><rect x="36" y="16" width="8" height="6" rx="1"/><rect x="20" y="28" width="8" height="6" rx="1"/><rect x="36" y="28" width="8" height="6" rx="1"/><rect x="26" y="40" width="12" height="12"/></svg>',
  GARAZE: '<svg viewBox="0 0 64 64" fill="none" stroke="#57534e" stroke-width="2"><rect x="10" y="24" width="44" height="28" rx="2"/><path d="M6 26L32 12L58 26"/><rect x="18" y="34" width="28" height="16" rx="1"/><line x1="18" y1="38" x2="46" y2="38"/><line x1="18" y1="42" x2="46" y2="42"/><line x1="18" y1="46" x2="46" y2="46"/></svg>',
  SKLADY: '<svg viewBox="0 0 64 64" fill="none" stroke="#64748b" stroke-width="2"><rect x="8" y="22" width="48" height="30" rx="2"/><path d="M4 24L32 10L60 24"/><rect x="22" y="32" width="20" height="18" rx="1"/><line x1="32" y1="32" x2="32" y2="50"/></svg>',
  DRAZBY: '<svg viewBox="0 0 64 64" fill="none" stroke="#dc2626" stroke-width="2"><path d="M20 44L44 20"/><rect x="38" y="12" width="14" height="14" rx="2" transform="rotate(45 45 19)"/><rect x="12" y="46" width="16" height="8" rx="2"/><line x1="8" y1="56" x2="56" y2="56"/></svg>',
  NOVOSTAVBY: '<svg viewBox="0 0 64 64" fill="none" stroke="#059669" stroke-width="2"><rect x="14" y="18" width="36" height="34" rx="2"/><path d="M10 20L32 6L54 20"/><rect x="20" y="26" width="8" height="6" rx="1"/><rect x="36" y="26" width="8" height="6" rx="1"/><rect x="26" y="38" width="12" height="14"/><circle cx="50" cy="14" r="6"/><path d="M50 10V18M46 14H54" stroke-width="2"/></svg>',
  PODILY: '<svg viewBox="0 0 64 64" fill="none" stroke="#ea580c" stroke-width="2"><circle cx="32" cy="32" r="20"/><line x1="32" y1="12" x2="32" y2="32"/><line x1="32" y1="32" x2="49" y2="42"/><line x1="32" y1="32" x2="15" y2="42"/></svg>',
  ZEMEDELSKE: '<svg viewBox="0 0 64 64" fill="none" stroke="#65a30d" stroke-width="2"><path d="M4 52Q16 36 32 48Q48 36 60 52"/><line x1="20" y1="20" x2="20" y2="42"/><path d="M14 22Q20 10 26 22"/><line x1="36" y1="16" x2="36" y2="40"/><path d="M30 18Q36 6 42 18"/><line x1="50" y1="24" x2="50" y2="44"/><path d="M44 26Q50 14 56 26"/></svg>',
  OSTATNI: '<svg viewBox="0 0 64 64" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="32" cy="28" r="14"/><path d="M32 18V28L38 34"/><rect x="14" y="46" width="36" height="6" rx="2"/></svg>'
};

var D=[],F=[],pg=1,pp=60,dt=null;
document.addEventListener('DOMContentLoaded',load);

function load(){
  document.getElementById('loading').classList.remove('hidden');
  fetch('/api/reality-data?dataset=sreality')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){
      D=d;
      // Reklasifikace: pole/orná/zemědělský z POZEMKY → ZEMEDELSKE
      var zemedRe=/\bpole\b|orná|zemědělsk|pastvin|louk/i;
      for(var j=0;j<D.length;j++){
        if(D[j]._category==='POZEMKY' && zemedRe.test(D[j].Nazev||''))D[j]._category='ZEMEDELSKE';
      }
      document.getElementById('sT').textContent=fm(D.length);
      buildOpts(); apply();
      document.getElementById('loading').classList.add('hidden');
    })
    .catch(function(e){
      console.error(e);
      document.getElementById('loading').innerHTML='<div style="text-align:center;color:#ce1126"><div style="font-size:32px;margin-bottom:8px">⚠</div><b>Chyba načítání</b><br><span style="font-size:12px;color:#888">'+e.message+'</span></div>';
    });
}

function fm(n){return n==null||isNaN(n)?'—':Number(n).toLocaleString('cs-CZ')}
function fmP(n){if(!n||isNaN(n))return'—';n=Number(n);if(n>=1e6)return(n/1e6).toFixed(n>=1e7?1:2).replace('.',',')+' M Kč';if(n>=1e3)return Math.round(n/1e3).toLocaleString('cs-CZ')+' tis. Kč';return fm(n)+' Kč'}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function exLoc(n){if(!n)return'';var m=n.match(/,\s*([^,]+)$/);return m?m[1].trim():''}

function buildOpts(){
  var c={},t={},tr={},p={};
  for(var i=0;i<D.length;i++){
    var d=D[i],cat=d._category||'OSTATNI',typ=d.Typ||'',tran=d.Transakce||'',por=d.Portal||'';
    c[cat]=(c[cat]||0)+1; if(typ)t[typ]=(t[typ]||0)+1; if(tran)tr[tran]=(tr[tran]||0)+1; if(por)p[por]=(p[por]||0)+1;
  }
  mkCB('fCat',c,'c');mkCB('fTyp',t,'t');mkCB('fTran',tr,'tr');mkCB('fPort',srt(p),'p');
}
function srt(o){var s={};Object.keys(o).sort(function(a,b){return o[b]-o[a]}).forEach(function(k){s[k]=o[k]});return s}
function mkCB(id,o,g){
  var el=document.getElementById(id),h='';
  var k=Object.keys(o).sort(function(a,b){return o[b]-o[a]});
  for(var i=0;i<k.length;i++)h+='<label class="fcheck"><input type="checkbox" data-g="'+g+'" value="'+k[i]+'" onchange="apply()"> '+k[i]+' <span class="cnt">'+fm(o[k[i]])+'</span></label>';
  el.innerHTML=h;
}
function gCh(g){var v=[],c=document.querySelectorAll('input[data-g="'+g+'"]:checked');for(var i=0;i<c.length;i++)v.push(c[i].value);return v}
function tog(h){h.querySelector('.arr').classList.toggle('open');h.nextElementSibling.classList.toggle('hidden')}
function deb(){clearTimeout(dt);dt=setTimeout(apply,200)}

function apply(){
  var s1=(document.getElementById('mainSearch').value||'').toLowerCase();
  var s2=(document.getElementById('sideSearch').value||'').toLowerCase();
  var s3=(document.getElementById('locSearch').value||'').toLowerCase();
  var cats=gCh('c'),typs=gCh('t'),trans=gCh('tr'),ports=gCh('p');
  var pMn=parseFloat(document.getElementById('prMin').value)||0, pMx=parseFloat(document.getElementById('prMax').value)||Infinity;
  var aMn=parseFloat(document.getElementById('arMin').value)||0, aMx=parseFloat(document.getElementById('arMax').value)||Infinity;
  var ppMn=parseFloat(document.getElementById('ppMin').value)||0, ppMx=parseFloat(document.getElementById('ppMax').value)||Infinity;
  var gps=document.querySelector('input[name="gps"]:checked').value;
  var sv=document.getElementById('sortBy').value;
  F=[];
  for(var i=0;i<D.length;i++){
    var d=D[i],nz=(d.Nazev||'').toLowerCase(),ms=(d.Mesto||'').toLowerCase();
    if(s1&&nz.indexOf(s1)===-1&&ms.indexOf(s1)===-1)continue; if(s2&&nz.indexOf(s2)===-1)continue; if(s3&&nz.indexOf(s3)===-1&&ms.indexOf(s3)===-1)continue;
    var cat=d._category||'OSTATNI';
    if(cats.length&&cats.indexOf(cat)===-1)continue;
    if(typs.length&&typs.indexOf(d.Typ||'')===-1)continue;
    if(trans.length&&trans.indexOf(d.Transakce||'')===-1)continue;
    if(ports.length&&ports.indexOf(d.Portal||'')===-1)continue;
    var pr=parseFloat(d.Cena)||0,ar=parseFloat(d['Plocha m²'])||0,ppm=parseFloat(d['Kč/m²'])||0;
    if(pr<pMn||pr>pMx)continue; if(ar<aMn||ar>aMx)continue; if(ppm<ppMn||ppm>ppMx)continue;
    var hg=d.GPS_Lat&&d.GPS_Lon&&d.GPS_Lat!==''&&d.GPS_Lon!=='';
    if(gps==='yes'&&!hg)continue; if(gps==='no'&&hg)continue;
    F.push(d);
  }
  var sp=sv.split('_'),sf=sp[0],sd=sp[1]==='a'?1:-1;
  F.sort(function(a,b){
    if(sf==='pr')return sd*((parseFloat(a.Cena)||0)-(parseFloat(b.Cena)||0));
    if(sf==='ar')return sd*((parseFloat(a['Plocha m²'])||0)-(parseFloat(b['Plocha m²'])||0));
    if(sf==='pp')return sd*((parseFloat(a['Kč/m²'])||0)-(parseFloat(b['Kč/m²'])||0));
    if(sf==='nm')return sd*(a.Nazev||'').localeCompare(b.Nazev||'','cs');
    return 0;
  });
  document.getElementById('sF').textContent=fm(F.length);
  var nb=0,nd=0,np=0;
  for(var i=0;i<F.length;i++){var cc=F[i]._category||'';if(cc==='BYTY')nb++;else if(cc==='DOMY')nd++;else if(cc==='POZEMKY')np++}
  document.getElementById('sB').textContent=fm(nb);document.getElementById('sD').textContent=fm(nd);document.getElementById('sP').textContent=fm(np);
  var tags=[];
  if(s1)tags.push('Hledání: "'+s1+'"'); if(s2)tags.push('Název: "'+s2+'"'); if(s3)tags.push('Lokalita: "'+s3+'"');
  if(cats.length)tags.push('Kat: '+cats.join(', ')); if(typs.length)tags.push('Typ: '+typs.join(', '));
  if(trans.length)tags.push('Trans: '+trans.join(', ')); if(ports.length)tags.push('Portál: '+ports.join(', '));
  if(pMn>0||pMx<Infinity)tags.push('Cena: '+(pMn>0?fm(pMn):'0')+'–'+(pMx<Infinity?fm(pMx):'∞'));
  if(aMn>0||aMx<Infinity)tags.push('Plocha: '+aMn+'–'+(aMx<Infinity?aMx:'∞')+' m²');
  if(ppMn>0||ppMx<Infinity)tags.push('Kč/m²: '+fm(ppMn)+'–'+(ppMx<Infinity?fm(ppMx):'∞'));
  if(gps==='yes')tags.push('GPS: ano'); if(gps==='no')tags.push('GPS: ne');
  var ab=document.getElementById('afBar'),at=document.getElementById('afTags');
  if(!tags.length){ab.classList.add('empty')}else{ab.classList.remove('empty');at.innerHTML=tags.map(function(t){return'<span class="af-chip">'+t+'</span>'}).join('')}
  document.getElementById('filterCount').textContent=tags.length+' aktivních';
  pg=1;render();
}

function render(){
  var g=document.getElementById('grid'),em=document.getElementById('emptyS');
  if(!F.length){g.innerHTML='';em.style.display='flex';updPag(0,0,0);return}
  em.style.display='none';
  var tp=Math.ceil(F.length/pp);if(pg>tp)pg=tp;
  var s=(pg-1)*pp,e=Math.min(s+pp,F.length),pd=F.slice(s,e);
  var h='';for(var i=0;i<pd.length;i++)h+=mkCard(pd[i]);
  g.innerHTML=h;updPag(tp,s+1,e);
}

function mkCard(d){
  var cat=d._category||'OSTATNI',pr=parseFloat(d.Cena)||0,ar=parseFloat(d['Plocha m²'])||0;
  var ppm=parseFloat(d['Kč/m²'])||0,hg=d.GPS_Lat&&d.GPS_Lon&&d.GPS_Lat!==''&&d.GPS_Lon!=='';
  var u=d._short_url||d.URL||'#';if(u&&!u.startsWith('http'))u='https://'+u;
  var mesto=d.Mesto||'',por=d.Portal||'',icon=ICONS[cat]||ICONS.OSTATNI;
  return'<div class="card" onclick="window.open(\''+u.replace(/'/g,"\\'")+'\',\'_blank\')">' +
    '<div class="c-img cimg-'+cat+'">' + icon +
    '<span class="c-cat-badge cb-'+cat+'">'+cat+'</span>' +
    '<span class="c-portal-badge">'+por+'</span></div>' +
    '<div class="c-body">' +
    '<div class="c-title">'+esc(d.Nazev||'—')+'</div>' +
    (mesto?'<div class="c-mesto">📍 '+esc(mesto)+(hg?' <span class="c-gps"></span>':'')+'</div>':'') +
    '<div class="c-price">'+fmP(pr)+'</div>' +
    '<div class="c-metrics">'+(ar>0?'<span><b>'+fm(ar)+'</b> m²</span>':'')+(ppm>0?'<span><b>'+fm(Math.round(ppm))+'</b> Kč/m²</span>':'')+'</div>' +
    '<div class="c-bot"><span class="c-loc">'+esc(d.Typ||'')+'</span>' +
    '<a class="c-link" href="'+esc(u)+'" target="_blank" onclick="event.stopPropagation()">Otevřít ↗</a></div></div></div>';
}

function updPag(tp,fr,to){
  var info=document.getElementById('pInfo');
  if(!F.length){info.textContent='0 z 0';document.getElementById('pBtns').innerHTML='';document.getElementById('pPrev').disabled=true;document.getElementById('pNext').disabled=true;return}
  info.textContent=fr+'–'+to+' z '+fm(F.length);
  document.getElementById('pPrev').disabled=pg<=1;document.getElementById('pNext').disabled=pg>=tp;
  var b='',st=Math.max(1,pg-3),en=Math.min(tp,pg+3);
  if(st>1)b+='<button class="pbtn" onclick="goPg(1)">1</button><span style="color:#ccc;padding:0 2px">…</span>';
  for(var p=st;p<=en;p++)b+='<button class="pbtn'+(p===pg?' active':'')+'" onclick="goPg('+p+')">'+p+'</button>';
  if(en<tp)b+='<span style="color:#ccc;padding:0 2px">…</span><button class="pbtn" onclick="goPg('+tp+')">'+tp+'</button>';
  document.getElementById('pBtns').innerHTML=b;
}

function chPg(d){pg+=d;render();document.getElementById('content').scrollTop=0}
function goPg(p){pg=p;render();document.getElementById('content').scrollTop=0}
function chPP(){pp=parseInt(document.getElementById('ppSel').value);pg=1;render()}
function setView(m,btn){var g=document.getElementById('grid');m==='list'?g.classList.add('listv'):g.classList.remove('listv');var bs=document.querySelectorAll('.vbtn');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');btn.classList.add('active')}
function setPr(el){document.getElementById('prMin').value=el.dataset.a;document.getElementById('prMax').value=el.dataset.b>9e8?'':el.dataset.b;actQt(el);apply()}
function setAr(el){document.getElementById('arMin').value=el.dataset.a;document.getElementById('arMax').value=el.dataset.b>9e5?'':el.dataset.b;actQt(el);apply()}
function setPP(el){document.getElementById('ppMin').value=el.dataset.a;document.getElementById('ppMax').value=el.dataset.b>9e5?'':el.dataset.b;actQt(el);apply()}
function setLoc(el,c){document.getElementById('locSearch').value=c;actQt(el);apply()}
function actQt(el){var s=el.parentElement.querySelectorAll('.qt');for(var i=0;i<s.length;i++)s[i].classList.remove('active');el.classList.add('active')}

function resetAll(){
  ['mainSearch','sideSearch','locSearch','prMin','prMax','arMin','arMax','ppMin','ppMax'].forEach(function(id){document.getElementById(id).value=''});
  var cb=document.querySelectorAll('.sb-b input[type="checkbox"]');for(var i=0;i<cb.length;i++)cb[i].checked=false;
  document.querySelector('input[name="gps"][value="all"]').checked=true;
  var qt=document.querySelectorAll('.qt');for(var i=0;i<qt.length;i++)qt[i].classList.remove('active');
  document.getElementById('sortBy').value='pr_d';apply();
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape')resetAll();
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('mainSearch').focus()}
});
</script>
</body>
</html>
